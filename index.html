
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Website Pertamaku</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f5ef;
            margin: 0;
            padding: 0;
            text-align: center;
        }

        header {
            background-color: #557c55;
            color: white;
            padding: 35px 20px;
        }

        main {
            padding: 40px 20px;
        }

        .kartu {
            background-color: white;
            max-width: 500px;
            margin: auto;
            padding: 30px;
            border-radius: 15px;
        }

        button {
            background-color: #557c55;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
        }

        footer {
            margin-top: 40px;
            padding: 20px;
            color: #666;
        }
    </style>
</head>

<body>

    <header>
        <h1>Selamat Datang!</h1>
        <p>Ini adalah website pertama saya.</p>
    </header>

    <main>
        <div class="kartu">
            <h2>Belajar GitHub</h2>

            <p>
                Saya sedang belajar membuat website
                dengan bantuan teknologi dan AI.
            </p>

            <button onclick="alert('Alhamdulillah! Website saya berhasil!')">
                Klik Saya
            </button>
        </div>
    </main>

    <footer>
        <p>Website dibuat oleh saya | 2026</p>
    </footer>

</body>
</html>
